{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}CDC Core — Centralizador & Operações do CDC{% endblock %}</title>
        <meta name="description" content="CDC Core - Plataforma Centralizadora de Infraestrutura e Operações do CDC">
        <meta name="author" content="CDC DevOps Team">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Favicon -->
        <link rel="shortcut icon" href="{% static 'img/favicon.png' %}">

        <!-- Lahomes Stylesheets & Icons -->
        <link rel="stylesheet" href="{% static 'lahomes/css/app.min.css' %}">
        <link rel="stylesheet" href="{% static 'lahomes/css/icons.min.css' %}">
        
        <!-- Base Custom Overrides -->
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        {% block extra_css %}{% endblock %}

        <style>
            body {
                background-color: #f8fafc;
                color: #334155;
                font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            .wrapper {
                display: flex;
                min-height: 100vh;
                overflow: hidden;
            }
            .page-content {
                flex-grow: 1;
                background-color: #f8fafc;
                padding-bottom: 40px;
                min-width: 0;
            }
            .card-lahomes {
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            ul, ol, li {
                list-style: none !important;
                list-style-type: none !important;
            }
            .sidebar-lahomes ul {
                padding-left: 0 !important;
                margin-left: 0 !important;
            }
            .nav-tabs-segmented {
                border-bottom: none !important;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .nav-tabs-segmented .nav-link {
                color: #64748b;
                border: 1px solid #e2e8f0;
                border-radius: 8px !important;
                padding: 10px 18px;
                font-weight: 600;
                background: #f8fafc;
                transition: all 0.2s ease;
            }
            .nav-tabs-segmented .nav-link.active {
                background: #2563eb !important;
                color: #ffffff !important;
                border-color: #2563eb !important;
                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            }
            .nav-tabs-segmented .nav-link:hover:not(.active) {
                background: #f1f5f9;
                color: #0f172a;
            }
        </style>
    </head>
    <body>
        <!-- Main Wrapper -->
        <div class="wrapper">
            
            <!-- Sidebar (Lahomes Style) -->
            {% include 'partials/_sidebar.html' %}

            <!-- Page Content Wrapper -->
            <div class="page-content">
                
                <!-- Topbar Header (Lahomes Style) -->
                {% include 'partials/_header.html' %}

                <!-- Container Fluid for Pages -->
                <div class="container-fluid px-4 py-3">
                    {% block content %}{% endblock %}
                </div>

                <!-- No Footer as requested for authenticated area -->
            </div>
            <!-- END Page Content -->

        </div>
        <!-- END Wrapper -->

        <!-- Vendor Scripts -->
        <script src="{% static 'js/vendor/jquery.min.js' %}"></script>
        <script src="{% static 'js/vendor/bootstrap.min.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
