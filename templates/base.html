{% load static %}
<!DOCTYPE html>
<!--[if IE 9]>         <html class="no-js lt-ie10" lang="pt-br"> <![endif]-->
<!--[if gt IE 9]><!--> <html class="no-js" lang="pt-br"> <!--<![endif]-->
    <head>
        <meta charset="utf-8">
        <title>{% block title %}CDC Core — Centralizador & Operações{% endblock %}</title>
        <meta name="description" content="CDC Core - Plataforma Centralizadora de Infraestrutura e Operações CDC">
        <meta name="author" content="CDC DevOps Team">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=0">

        <!-- Icons -->
        <link rel="shortcut icon" href="{% static 'img/favicon.png' %}">
        <link rel="apple-touch-icon" href="{% static 'img/icon57.png' %}" sizes="57x57">
        <link rel="apple-touch-icon" href="{% static 'img/icon72.png' %}" sizes="72x72">
        <link rel="apple-touch-icon" href="{% static 'img/icon76.png' %}" sizes="76x76">
        <link rel="apple-touch-icon" href="{% static 'img/icon114.png' %}" sizes="114x114">
        <link rel="apple-touch-icon" href="{% static 'img/icon120.png' %}" sizes="120x120">
        <link rel="apple-touch-icon" href="{% static 'img/icon144.png' %}" sizes="144x144">
        <link rel="apple-touch-icon" href="{% static 'img/icon152.png' %}" sizes="152x152">
        <link rel="apple-touch-icon" href="{% static 'img/icon180.png' %}" sizes="180x180">

        <!-- Stylesheets -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/plugins.css' %}">
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        <link rel="stylesheet" href="{% static 'css/themes.css' %}">
        {% block extra_css %}{% endblock %}

        <script src="{% static 'js/vendor/modernizr.min.js' %}"></script>
    </head>
    <body>
        <div id="page-wrapper">
            <!-- Preloader -->
            <div class="preloader themed-background">
                <h1 class="push-top-bottom text-light text-center"><strong>CDC</strong> Core</h1>
                <div class="inner">
                    <h3 class="text-light visible-lt-ie10"><strong>Carregando...</strong></h3>
                    <div class="preloader-spinner hidden-lt-ie10"></div>
                </div>
            </div>

            <!-- Page Container -->
            <div id="page-container" class="sidebar-partial sidebar-visible-lg sidebar-no-animations">
                
                <!-- Main Sidebar -->
                {% include 'partials/_sidebar.html' %}

                <!-- Main Container -->
                <div id="main-container">
                    
                    <!-- Header -->
                    {% include 'partials/_header.html' %}

                    <!-- Page Content -->
                    <div id="page-content">
                        {% block content %}{% endblock %}
                    </div>

                </div>
                <!-- END Main Container -->
            </div>
            <!-- END Page Container -->
        </div>
        <!-- END Page Wrapper -->

        <!-- Scroll to top link -->
        <a href="#" id="to-top"><i class="fa fa-angle-up"></i></a>

        <!-- Include JQuery and Bootstrap JS -->
        <script src="{% static 'js/vendor/jquery.min.js' %}"></script>
        <script src="{% static 'js/vendor/bootstrap.min.js' %}"></script>
        <script src="{% static 'js/plugins.js' %}"></script>
        <script src="{% static 'js/app.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
