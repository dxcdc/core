{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}CDC Core — Centralizador & Operações do CDC{% endblock %}</title>
        <meta name="description" content="CDC Core - Plataforma Centralizadora de Infraestrutura e Operações do CDC">
        <meta name="author" content="CDC DevOps Team">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Favicon -->
        <link rel="shortcut icon" href="{% static 'img/favicon.png' %}">

        <!-- Larkon Vendor & Icons CSS -->
        <link rel="stylesheet" href="{% static 'larkon/css/vendor.min.css' %}">
        <link rel="stylesheet" href="{% static 'larkon/css/icons.min.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
        
        <!-- Larkon Core App CSS -->
        <link rel="stylesheet" href="{% static 'larkon/css/app.min.css' %}">
        
        <!-- Base Custom Overrides -->
        <link rel="stylesheet" href="{% static 'css/main.css' %}">

        <!-- Larkon Theme Config JS -->
        <script src="{% static 'larkon/js/config.js' %}"></script>

        {% block extra_css %}{% endblock %}

        <style>
            :root {
                --bs-body-bg: #f8fafc;
                --bs-body-color: #334155;
            }
            body {
                background-color: #f8fafc;
                color: #334155;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
            }
            .wrapper {
                display: flex;
                min-height: 100vh;
                position: relative;
            }

            /* TOPBAR FIXA NO TOPO COM ZERO DESPERDÍCIO */
            .topbar {
                position: fixed !important;
                top: 0 !important;
                left: 64px !important;
                right: 0 !important;
                height: 50px !important;
                min-height: 50px !important;
                max-height: 50px !important;
                z-index: 1030 !important;
                background: #ffffff !important;
                border-bottom: 1px solid #e2e8f0 !important;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03) !important;
                margin-left: 0 !important;
                width: calc(100% - 64px) !important;
                padding: 0 16px !important;
            }

            /* CONTEÚDO PERFEITAMENTE COLADO NA SIDEBAR (64px) */
            .page-content {
                margin-left: 64px !important;
                margin-top: 50px !important;
                padding: 16px 14px 40px 14px !important;
                width: calc(100% - 64px) !important;
                min-width: 0 !important;
                background-color: #f8fafc !important;
                flex-grow: 1 !important;
            }

            .card-lahomes, .card {
                border-radius: 12px;
                border: 1px solid #e2e8f0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            }
            ul, ol, li {
                list-style: none !important;
                list-style-type: none !important;
            }
            .nav-tabs-segmented {
                border-bottom: none !important;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .nav-tabs-segmented .nav-link {
                color: #64748b;
                border: 1px solid #e2e8f0;
                border-radius: 8px !important;
                padding: 10px 18px;
                font-weight: 600;
                background: #ffffff;
                transition: all 0.2s ease;
            }
            .nav-tabs-segmented .nav-link.active {
                background: #2563eb !important;
                color: #ffffff !important;
                border-color: #2563eb !important;
                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            }
            .nav-tabs-segmented .nav-link:hover:not(.active) {
                background: #f1f5f9;
                color: #0f172a;
            }
        </style>
    </head>
    <body>
        <!-- Main Larkon Wrapper -->
        <div class="wrapper">
            
            <!-- Sidebar (Larkon Navigation - 58px Fixa) -->
            {% include 'partials/_sidebar.html' %}

            <!-- Topbar Header (Larkon Style - Fixa no Topo) -->
            {% include 'partials/_header.html' %}

            <!-- Page Content (Colado na Sidebar) -->
            <div class="page-content">
                <div class="container-fluid p-0">
                    {% block content %}{% endblock %}
                </div>
            </div>
            <!-- END Page Content -->

        </div>
        <!-- END Wrapper -->

        <!-- Larkon Vendor & App JS -->
        <script src="{% static 'larkon/js/vendor.js' %}"></script>
        <script src="{% static 'larkon/js/app.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
