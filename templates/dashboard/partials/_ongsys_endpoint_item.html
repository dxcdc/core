<div class="endpoint-row-container mb-3">
    <div class="endpoint-row d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <span class="method-badge {% if ep.metodo == 'GET' %}method-get{% else %}method-post{% endif %}">
                {{ ep.metodo }}
            </span>
            <div>
                <h6 class="fw-bold text-dark mb-1 d-flex align-items-center gap-2">
                    {{ ep.nome }}
                    <code class="text-primary font-monospace fw-normal" style="font-size: 0.84em;">/api/v2/{{ ep.path }}</code>
                </h6>
                <p class="text-muted mb-0" style="font-size: 0.84em; line-height: 1.35;">
                    {{ ep.descricao }}
                </p>
                {% if ep.parametros %}
                <small class="text-muted d-block mt-1" style="font-size: 0.76em;">
                    <strong class="text-dark">Exemplo / Parâmetros:</strong> <code>{{ ep.parametros }}</code>
                </small>
                {% endif %}
            </div>
        </div>

        <div>
            <button type="button" class="btn btn-sm btn-outline-primary fw-bold d-flex align-items-center gap-1.5" onclick="openTestModal('{{ ep.path }}', '{{ ep.metodo }}', '{{ ep.nome|escapejs }}', '{{ ep.parametros|escapejs }}')" style="border-radius: 6px; font-size: 0.82em;">
                <i class="ri-play-circle-line fs-16"></i> Testar Endpoint
            </button>
        </div>
    </div>
</div>
